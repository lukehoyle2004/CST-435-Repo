# Render.com blueprint for the FineTuneFleet FastAPI service.
# In the Render dashboard: New -> Blueprint -> point at this repo.
# Set SUPABASE_URL and SUPABASE_SERVICE_KEY as environment variables (secrets)
# in the service settings after the first deploy.
#
# The build step downloads the deployed fine-tuned checkpoint from the GitHub
# release (and refuses it unless its sha256 matches the deployed row in
# docs/experiments/results.json), plus flan-t5-small, into the service directory,
# so a request never waits on a download.
services:
  - type: web
    name: finetunefleet-api
    runtime: python
    rootDir: Deep-Learning/Project-Templates/Topic_6_fine-it
    plan: free
    buildCommand: "pip install -r api/requirements.txt && python -m scripts.fetch_model"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FTF_MODEL_URL
        value: "https://github.com/lukehoyle2004/CST-435-Repo/releases/download/finetunefleet-v1/finetunefleet-deployed.tar.gz"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: HF_HOME
        value: ".hf_cache"
      - key: TORCH_NUM_THREADS
        value: "1"
      # One model in memory at a time: both together ran out of memory on the
      # 512 MB instance (first deploy, 2026-11-18). Switching endpoints therefore
      # costs a cold start, which the API reports as load_ms / cold_start.
      - key: FTF_MAX_RESIDENT
        value: "1"
      # flan-t5-small with float16-stored weights, float32 compute (~155 MB of
      # weights instead of ~310 MB); agreement with the float32 baseline is in
      # docs/experiments/zero_shot_served_variant.json.
      - key: FTF_ZERO_SHOT_HALF_WEIGHTS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # A fixed mmap threshold stops glibc from raising it after large frees, so model
      # tensors are always mmap'd and go back to the OS when a model is evicted.
      - key: MALLOC_MMAP_THRESHOLD_
        value: "131072"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "131072"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
