# Runs the See-Sense (Topic 3) pytest suite on every push and pull request that
# touches the project. No secrets are configured, so the live Supabase round-trip
# test skips and everything else (including the Supabase-outage tests) runs
# against the in-memory fake.
name: See-Sense tests

on:
  push:
    paths:
      - "Deep-Learning/Project-Templates/Topic_3_see-sense/**"
      - ".github/workflows/see-sense-tests.yml"
  pull_request:
    paths:
      - "Deep-Learning/Project-Templates/Topic_3_see-sense/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Deep-Learning/Project-Templates/Topic_3_see-sense
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches PYTHON_VERSION in render.yaml
          cache: pip
          cache-dependency-path: |
            Deep-Learning/Project-Templates/Topic_3_see-sense/api/requirements.txt
            Deep-Learning/Project-Templates/Topic_3_see-sense/ui/requirements.txt
            Deep-Learning/Project-Templates/Topic_3_see-sense/requirements-dev.txt

      - name: Install dependencies (CPU-only torch)
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q
