# Runs the Seq-Sight (Topic 4) pytest suite on every push and pull request that
# touches the project. No secrets are configured, so the live Supabase round-trip
# test skips and everything else runs against the in-memory fake: the hand-written
# attention tests, tokenizer/mask tests, both exported models, the API (including
# the Supabase-outage path) and the Streamlit UI run headlessly with AppTest.
# The IMDB parquet files are not needed: data tests use small fixtures.
name: Seq-Sight tests

on:
  push:
    paths:
      - "Deep-Learning/Project-Templates/Topic_4_attend-it/**"
      - ".github/workflows/seq-sight-tests.yml"
  pull_request:
    paths:
      - "Deep-Learning/Project-Templates/Topic_4_attend-it/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Deep-Learning/Project-Templates/Topic_4_attend-it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches PYTHON_VERSION in render.yaml
          cache: pip
          cache-dependency-path: |
            Deep-Learning/Project-Templates/Topic_4_attend-it/api/requirements.txt
            Deep-Learning/Project-Templates/Topic_4_attend-it/ui/requirements.txt
            Deep-Learning/Project-Templates/Topic_4_attend-it/requirements-dev.txt

      - name: Install dependencies (CPU-only torch)
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q
